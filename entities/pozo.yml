name: pozo
description: >
  Entidad canonica de pozos integrada desde las fuentes Curated AVM y BDP.

sources:
  - name: AVM
    schema: curated_produccion_yacimientos_avm
    table: avm_pozos_ubicacion
    watermark:
      column: fecha_actualizacion
      safety_lookback_minutes: 0
    deduplication:
      strategy: DISTINCT

  - name: BDP
    schema: curated_produccion_yacimientos_bdp
    table: bdp_well
    watermark:
      column: fecha_actualizacion
      safety_lookback_minutes: 0
    deduplication:
      strategy: DISTINCT

business_keys:
  - uwi

attributes:
  - name: Well_Name
    type: string
    mapping:
      AVM: nombre
      BDP:
        - well_name
        - plot_name
    strategy: SOURCE_PRIORITY
    priority:
      - AVM
      - BDP

  - name: active_ind
    mapping:
      AVM: active_ind
    strategy: SOURCE_PRIORITY
    priority:
      - AVM

validations:
  required_columns: []
  check_duplicates: true
  custom_rules: []

transformations: []

persistence:
  strategy: UPSERT
  table_name: pozo
